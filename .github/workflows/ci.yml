name: CI

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all apps + packages)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter luveeparfum type-check && pnpm --filter medusa type-check

  e2e:
    name: E2E (luveeparfum mock)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter luveeparfum exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm --filter @realizah/types build && pnpm --filter @realizah/utils build

      - name: Build luveeparfum
        run: pnpm --filter luveeparfum build

      - name: Run E2E tests (mock mode)
        run: pnpm --filter luveeparfum e2e
        env:
          CI: true
